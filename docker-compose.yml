services:
  mysql:
    image: mysql:8.0
    container_name: foodexpress_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: foodexpress
    ports:
      - "3307:3306"
    volumes:
      # Sem schema.sql em docker-entrypoint-initdb.d: a estrutura vem de
      # `npm run migrar`, que é a única fonte da verdade e roda tanto em
      # banco novo quanto em existente.
      - foodexpress_data:/var/lib/mysql

volumes:
  foodexpress_data:
